<!DOCTYPE html>
<html>

<title>Octava — Email Signature — Outline Card</title>

<body style="margin:0; padding:32px; background:#ffffff;">

<!-- ================================================================
     OCTAVA — EMAIL SIGNATURE · V04 OUTLINE CARD
     Light outlined card: brand lockup, icon rail, and the Octava
     chip cut into diagonal slices. Rounded corners via border-radius
     render everywhere except classic Outlook desktop (square there).
     REQUIRES DEPLOY: push the repo so the sig-*.png assets are live.
     To add LinkedIn: uncomment the marked row in the icon rail and
     set your profile URL (icon asset is already deployed).
     To use a headshot instead of the sliced chip: regenerate
     sig-sliced-mark.png from a photo (ask Claude).
     ================================================================ -->

<table cellpadding="0" cellspacing="0" border="0" width="480" style="border-collapse:separate; width:480px;">
  <tr>
    <td bgcolor="#ffffff" style="background-color:#ffffff; border:1px solid #e4e4e7; border-radius:16px; padding:20px 22px;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
        <tr>
          <td width="42" valign="middle" style="width:42px;">
            <!-- Icon rail -->
            <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate; border:1px solid #e4e4e7; border-radius:21px;">
              <tr>
                <td style="padding:11px 10px 7px 10px;">
                  <a href="https://www.octava.cloud" target="_blank" style="text-decoration:none;"><img src="https://www.octava.cloud/images/sig-icon-web.png" width="20" height="20" alt="Website" border="0" style="display:block; width:20px; height:20px;" /></a>
                </td>
              </tr>
              <tr>
                <td style="padding:7px 10px 11px 10px;">
                  <a href="mailto:marcelo@octava.cloud" style="text-decoration:none;"><img src="https://www.octava.cloud/images/sig-icon-mail.png" width="20" height="20" alt="Email" border="0" style="display:block; width:20px; height:20px;" /></a>
                </td>
              </tr>
              <!-- LinkedIn — uncomment and set your profile URL:
              <tr>
                <td style="padding:7px 10px 11px 10px;">
                  <a href="https://www.linkedin.com/in/YOUR-PROFILE" target="_blank" style="text-decoration:none;"><img src="https://www.octava.cloud/images/sig-icon-in.png" width="20" height="20" alt="LinkedIn" border="0" style="display:block; width:20px; height:20px;" /></a>
                </td>
              </tr>
              -->
            </table>
          </td>
          <td width="20" style="width:20px; font-size:1px;">&nbsp;</td>
          <td valign="middle">
            <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td><a href="https://www.octava.cloud" target="_blank" style="text-decoration:none;"><img src="https://www.octava.cloud/images/sig-mark-dark.png" width="193" height="36" alt="Octava" border="0" style="display:block; width:193px; height:36px;" /></a></td>
              </tr>
              <tr><td height="12" style="height:12px; font-size:1px; line-height:1px;">&nbsp;</td></tr>
              <tr>
                <td style="font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:17px; font-weight:bold; color:#050505; letter-spacing:0.2px; mso-line-height-rule:exactly; line-height:21px;">Marcelo Santos</td>
              </tr>
              <tr>
                <td style="padding-top:4px; font-family:Consolas,'Courier New',monospace; font-size:10px; letter-spacing:1.4px; color:#71717a; text-transform:uppercase; mso-line-height-rule:exactly; line-height:14px;">FOUNDER &middot; AZURE CLOUD ENGINEER</td>
              </tr>
              <tr><td height="10" style="height:10px; font-size:1px; line-height:1px;">&nbsp;</td></tr>
              <tr>
                <td style="font-family:Consolas,'Courier New',monospace; font-size:10px; font-weight:bold; letter-spacing:1.4px; color:#050505; text-transform:uppercase; mso-line-height-rule:exactly; line-height:14px;">OCTAVA CONSULTING</td>
              </tr>
              <tr>
                <td style="padding-top:5px; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:13px; mso-line-height-rule:exactly; line-height:19px;">
                  <a href="mailto:marcelo@octava.cloud" style="color:#3f3f46; text-decoration:none;">marcelo@octava.cloud</a><br />
                  <a href="https://www.octava.cloud" target="_blank" style="color:#3f3f46; text-decoration:none;">octava.cloud</a>
                </td>
              </tr>
            </table>
          </td>
          <td width="12" style="width:12px; font-size:1px;">&nbsp;</td>
          <td width="115" valign="middle" style="width:115px;">
            <a href="https://www.octava.cloud" target="_blank" style="text-decoration:none;"><img src="https://www.octava.cloud/images/sig-sliced-mark.png" width="115" height="120" alt="Octava mark" border="0" style="display:block; width:115px; height:120px;" /></a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
